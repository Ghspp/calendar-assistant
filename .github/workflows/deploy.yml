# Build the app and publish it to GitHub Pages.
#
# Why this matters beyond hosting: the Web Speech API refuses to start outside a secure
# context. On a phone that means the microphone only works over HTTPS, which Pages
# provides for free. Until this runs, voice input is limited to localhost.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build must never reach the phone.
      - run: npm test
      - run: npx tsc --noEmit

      - name: Build
        env:
          # A project site is served from /<repo>/, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Not a secret — it ships in the bundle — but it is specific to your Google
          # Cloud project, so it lives in repository variables rather than in git.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Increases by one on every publish, so the footer says which build is live.
          APP_VERSION: ${{ github.run_number }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
